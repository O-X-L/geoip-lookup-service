---

# https://golangci-lint.run/docs/configuration/file/

version: "2"

run:
  go: '1.25.3'

output:
  formats:
    # text:
    #   path: 'stdout'
    #   print-linter-name: false
    #   print-issued-lines: true
    #   colors: true
    # json:
    #   path: 'stdout'
    tab:
      path: 'stdout'
      print-linter-name: true
      colors: true

  sort-order:
    - file
    - severity
    # - linter

severity:
  default: error
  rules:
    - linters:
        - unused
        - errcheck
      severity: warning


linters:
  # only run those that are excluded in the 'fail' profile
  default: none
  enable:
    - errcheck
    - unused
